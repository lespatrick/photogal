# ==============================================================================
# photogal — Example Proxmox VE Container Config (/etc/pve/lxc/<CTID>.conf)
# ==============================================================================

arch: amd64
cores: 2
features: nesting=1
hostname: photogal
memory: 2048
net0: name=eth0,bridge=vmbr0,firewall=1,hwaddr=BC:24:11:AA:BB:CC,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:subvol-205-disk-0,size=16G
swap: 512
unprivileged: 1

# Optional: Bind-mount external storage pool or NAS (ZFS dataset / NFS / SMB mount)
# Replace with host path to photos:
# mp0: /mnt/pve/storage/photogal-data,mp=/opt/photogal/data
# mp1: /mnt/pve/storage/photogal-storage,mp=/opt/photogal/storage
