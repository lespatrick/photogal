name: Build & Release Standalone (LXC)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Specific version tag to release (e.g. v0.3.0). If empty, automatically bumps version.'
        required: false
        default: ''
      bump_type:
        description: 'Version bump type if auto-bumping (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build:
    name: Build Standalone Bundle (Debian 12)
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git python3 make g++ tar gzip ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build Next.js standalone application
        run: |
          export NODE_ENV=production
          export NEXT_TELEMETRY_DISABLED=1
          npm run build

      - name: Package standalone bundle
        run: |
          set -e
          # If standalone output was generated in a nested folder, flatten it
          if [ ! -f ".next/standalone/server.js" ] && [ -d ".next/standalone" ]; then
            NESTED_SERVER=$(find .next/standalone -maxdepth 4 -name "server.js" | head -n 1)
            if [ -n "$NESTED_SERVER" ]; then
              echo "Flattening standalone from $(dirname "$NESTED_SERVER")..."
              cp -a "$(dirname "$NESTED_SERVER")/." .next/standalone/
            fi
          fi

          # Copy static files, server chunks, public assets, scripts, and deployment helpers into standalone
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          cp -r .next/server .next/standalone/.next/
          cp -r scripts .next/standalone/
          cp -r deploy .next/standalone/

          # Strict security & data integrity: Ensure NO runtime data, databases, storage files, or env files leak into release package
          rm -rf .next/standalone/data .next/standalone/storage .next/standalone/.env* .next/standalone/backups
          if [ -d ".next/standalone/data" ] || [ -d ".next/standalone/storage" ]; then
            echo "Error: persistent data or storage directories detected in standalone bundle!"
            exit 1
          fi

          # Create standalone tarball and sha256 checksum
          cd .next/standalone
          tar -czf ../../photogal-standalone-linux-x64.tar.gz .
          cd ../..
          sha256sum photogal-standalone-linux-x64.tar.gz > photogal-standalone-linux-x64.tar.gz.sha256

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: photogal-standalone-linux-x64
          path: |
            photogal-standalone-linux-x64.tar.gz
            photogal-standalone-linux-x64.tar.gz.sha256
          retention-days: 5

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: photogal-standalone-linux-x64

      - name: Determine and Tag Next Release Version
        id: versioning
        uses: actions/github-script@v7
        with:
          script: |
            function parseSemver(str) {
              const match = str.replace(/^v/, '').match(/^(\d+)\.(\d+)(?:\.(\d+))?$/);
              if (!match) return null;
              return {
                major: parseInt(match[1], 10),
                minor: parseInt(match[2], 10),
                patch: parseInt(match[3] || '0', 10),
                raw: str
              };
            }

            function compareSemver(a, b) {
              if (a.major !== b.major) return a.major - b.major;
              if (a.minor !== b.minor) return a.minor - b.minor;
              return a.patch - b.patch;
            }

            function getNextVersion(existingTags, pkgVersion, bumpType) {
              const existingSemvers = existingTags.map(parseSemver).filter(Boolean);
              existingSemvers.sort(compareSemver);
              const highestTag = existingSemvers.length > 0 ? existingSemvers[existingSemvers.length - 1] : null;
              const parsedPkg = parseSemver(pkgVersion);

              if (!highestTag) {
                return parsedPkg ? `v${parsedPkg.major}.${parsedPkg.minor}.${parsedPkg.patch}` : 'v0.1.0';
              }

              if (parsedPkg && compareSemver(parsedPkg, highestTag) > 0) {
                return `v${parsedPkg.major}.${parsedPkg.minor}.${parsedPkg.patch}`;
              }

              if (bumpType === 'major') {
                return `v${highestTag.major + 1}.0.0`;
              } else if (bumpType === 'minor') {
                return `v${highestTag.major}.${highestTag.minor + 1}.0`;
              } else {
                return `v${highestTag.major}.${highestTag.minor}.${highestTag.patch + 1}`;
              }
            }

            let targetVersion = '';

            // 1. If triggered by an explicit git tag (other than 'latest')
            if (context.ref.startsWith('refs/tags/') && context.ref !== 'refs/tags/latest') {
              targetVersion = context.ref.replace('refs/tags/', '');
              console.log('Triggered by explicit git tag:', targetVersion);
            } else if (context.payload.inputs && context.payload.inputs.custom_version) {
              // 2. If specified via manual workflow_dispatch input
              const custom = context.payload.inputs.custom_version.trim();
              targetVersion = custom.startsWith('v') ? custom : 'v' + custom;
              console.log('Manual version specified:', targetVersion);
            } else {
              // 3. Auto-bump next version based on existing tags and package.json
              const tagsResponse = await github.paginate(github.rest.repos.listTags, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const tagNames = tagsResponse.map(t => t.name);
              console.log('Found existing tags in repository:', tagNames);

              const fs = require('fs');
              let pkgVersion = '0.3.0';
              try {
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                if (pkg.version) pkgVersion = pkg.version;
              } catch (e) {
                console.log('Could not read package.json version:', e.message);
              }

              const bumpType = (context.payload.inputs && context.payload.inputs.bump_type) || 'patch';
              targetVersion = getNextVersion(tagNames, pkgVersion, bumpType);
              console.log(`Calculated next version (${bumpType}):`, targetVersion);
            }

            // Create target git tag if it does not already exist
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/tags/' + targetVersion,
                sha: context.sha
              });
              console.log('Created git tag:', targetVersion);
            } catch (err) {
              console.log('Note on tag creation:', err.message);
            }

            // Update or create 'latest' tag
            const latestRef = 'tags/latest';
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: latestRef,
                sha: context.sha,
                force: true
              });
              console.log('Updated refs/' + latestRef + ' to ' + context.sha);
            } catch (err) {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/' + latestRef,
                sha: context.sha
              });
              console.log('Created refs/' + latestRef + ' at ' + context.sha);
            }

            core.setOutput('version_tag', targetVersion);

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_tag }}
          name: ${{ steps.versioning.outputs.version_tag }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            photogal-standalone-linux-x64.tar.gz
            photogal-standalone-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Latest GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Latest Build (main)'
          prerelease: false
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            photogal-standalone-linux-x64.tar.gz
            photogal-standalone-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

